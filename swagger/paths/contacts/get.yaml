tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Get list of contacts with this endpoint'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: '1'
  - in: query
    name: perPage
    schema:
      type: integer
      example: '10'
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        ['_id', 'name', 'phoneNumber', 'email', 'isFavourite', 'contactType']
      example: 'name'
      default: '_id'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'dsc']
      example: 'asc'
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: 'false'
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: 'personal'
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                [
                  'data',
                  'page',
                  'perPage',
                  'total',
                  'totalPages',
                  'hasNextPage',
                  'hasPreviousPage',
                ]
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 20
                total:
                  type: number
                  example: 40
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false

  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
